name: E2E

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Install agentcore dependencies
        run: cd agentcore/server-fork && bun install

      - name: Run E2E suite
        run: uv run pytest tests/e2e_user/ -v --tb=short
